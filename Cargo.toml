[package]
name = "lyma"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Lyma public library crate and workspace root"
license = "MIT OR Apache-2.0"
repository = "https://github.com/example/lyma"
readme = "README.md"
keywords = ["lua", "dsl", "runtime"]
categories = ["compilers", "development-tools"]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["parser"]
syntax = ["dep:lyma-syntax"]
parser = ["syntax", "dep:lyma-parser"]
serde = ["syntax", "dep:lyma-serde"]
lyba = ["syntax", "dep:lyma-lyba"]
runtime = ["dep:lyma-runtime"]
eval = ["runtime", "dep:lyma-eval"]
omnilua = ["eval", "engine-omnilua"]
engine-omnilua = ["runtime", "dep:lyma-engine-omnilua"]
cli = []
python = ["parser", "lyba", "dep:pyo3", "pyo3/abi3-py38", "pyo3/extension-module"]

[dependencies]
lyma-syntax = { path = "crates/lyma-syntax", optional = true }
lyma-parser = { path = "crates/lyma-parser", optional = true }
lyma-serde = { path = "crates/lyma-serde", optional = true }
lyma-lyba = { path = "crates/lyma-lyba", optional = true }
lyma-runtime = { path = "crates/lyma-runtime", optional = true }
lyma-eval = { path = "crates/lyma-eval", optional = true }
lyma-engine-omnilua = { path = "crates/lyma-engine-omnilua", optional = true }
pyo3 = { version = "0.29.0", optional = true }

[workspace]
resolver = "3"
members = [
    ".",
    "crates/lyma-syntax",
    "crates/lyma-parser",
    "crates/lyma-serde",
    "crates/lyma-lyba",
    "crates/lyma-eval",
    "crates/lyma-runtime",
    "crates/lyma-engine-omnilua",
    "crates/lyma-cli",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/example/lyma"

[workspace.dependencies]
crc32c = { version = "0.6" }
omnilua = { version = "0.4.3" }
serde = { version = "1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -2 }
nursery = { level = "warn", priority = -3 }
cargo = { level = "warn", priority = -4 }
module_name_repetitions = "allow"
multiple_crate_versions = "allow"

[package.metadata.release]
shared-version = true
tag-name = "v{{version}}"
pre-release-commit-message = "release: lyma {{version}}"

[workspace.metadata.ci]
msrv = "1.85.0"
metadata = "cargo metadata --format-version=1"
fmt = "cargo fmt --all --check"
clippy = "cargo clippy --workspace --all-targets --all-features -- -D warnings"
test = "cargo test --workspace --all-features"
