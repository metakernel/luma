[package]
name = "luma-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "luma"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.9", features = ["derive"] }
luma = { path = "../..", default-features = false, features = ["parser"] }
luma-eval = { path = "../luma-eval", optional = true }
luma-engine-omnilua = { path = "../luma-engine-omnilua", optional = true }
luma-parser = { path = "../luma-parser" }
luma-syntax = { path = "../luma-syntax" }
serde_json = "1.0.120"

[features]
default = []
eval = ["dep:luma-eval"]
engine-omnilua = ["eval", "dep:luma-engine-omnilua", "luma/engine-omnilua"]

[dev-dependencies]
assert_cmd = "2.0.16"
predicates = "3.1.2"
tempfile = "3.12.0"

[lints]
workspace = true
