[package]
name = "luma-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Python bindings for Luma and LUMBA"

[lib]
name = "luma_python"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
luma = { path = "../..", default-features = false, features = ["parser", "serde", "lumba"] }
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py38"] }
